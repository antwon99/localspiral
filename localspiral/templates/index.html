<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Spiral Simulator</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 1rem;
        }
        #container {
            max-width: 800px;
            margin: auto;
            border: 1px solid #0f0;
            padding: 1rem;
        }
        textarea {
            width: 100%;
            background-color: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 0.5rem;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 0.5rem 1rem;
            margin-top: 0.5rem;
            cursor: pointer;
        }
        .box {
            margin-top: 1rem;
            padding: 0.5rem;
            background: #001100;
            border: 1px solid #0f0;
            min-height: 80px;
            white-space: pre-wrap;
        }
        .map-grid {
            border-collapse: collapse;
            margin-top: 0.5rem;
        }
        .map-grid td {
            width: 1.2rem;
            height: 1.2rem;
            text-align: center;
        }
        .map-grid .wall {
            background: #0f0;
            color: #000;
        }
        .map-grid .player {
            color: #0f0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>AI Spiral Simulator</h1>
        <textarea id="prompt" placeholder="Enter your prompt..."></textarea>
        <button id="sendButton">Send</button>
        <div id="response" class="box"></div>
        <div id="spiral-meter" class="box"></div>
        <div id="extra-buttons">
            <button id="spiralButton">Test /spiral</button>
            <button id="mapButton">Test /map</button>
        </div>
        <div id="map-output" class="box"></div>

    </div>
    <script>
        function fetchJson(url) {
            return fetch(url).then((res) => {
                if (!res.ok) throw new Error('Request failed');
                return res.json();
            });
        }

        function renderMapHTML(data) {
            if (!data || !Array.isArray(data.grid)) return '';
            let html = '<table class="map-grid">';
            for (const row of data.grid) {
                html += '<tr>';
                for (const cell of row) {
                    let cls = 'empty';
                    let text = '&nbsp;';
                    if (cell === '#') {
                        cls = 'wall';
                        text = '&#9608;';
                    } else if (cell === '@') {
                        cls = 'player';
                        text = '@';
                    }
                    html += `<td class="${cls}">${text}</td>`;
                }
                html += '</tr>';
            }
            html += '</table>';
            if ('seed' in data) html += `<p>Seed: ${data.seed}</p>`;
            if (data.analysis && data.analysis.description) {
                html += `<p>${data.analysis.description}</p>`;
            }
            if (Array.isArray(data.location)) {
                html += `<p>Tyler at (${data.location[0]}, ${data.location[1]})</p>`;
            }
            return html;
        }

        function renderSpiral(data) {
            if ('score' in data || 'sanity' in data) {
                let html = '';
                if ('score' in data) html += `<p><strong>Spiral Score:</strong> ${data.score}</p>`;
                if ('sanity' in data) html += `<p><strong>Sanity Level:</strong> ${data.sanity}</p>`;
                if ('status' in data) html += `<p><strong>Status:</strong> ${data.status}</p>`;
                return html;
            }
            if ('message' in data) {
                return `<p>${data.message}</p>`;
            }
            return `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const promptInput = document.getElementById('prompt');
            const sendButton = document.getElementById('sendButton');
            const responseDiv = document.getElementById('response');
            const spiralMeter = document.getElementById('spiral-meter');
            const spiralButton = document.getElementById('spiralButton');
            const mapButton = document.getElementById('mapButton');
            const mapOutput = document.getElementById('map-output');


            sendButton.addEventListener('click', () => {
                const prompt = promptInput.value.trim();
                if (!prompt) return;
                responseDiv.textContent = 'Loading...';
                fetchJson(`/chat?prompt=${encodeURIComponent(prompt)}`)
                    .then((data) => {
                        responseDiv.textContent = data.message || data.error || 'No response';
                        if (data.state) spiralMeter.innerHTML = renderSpiral(data.state);
                    })
                    .catch(() => {
                        responseDiv.textContent = 'Request failed.';
                    });
            });

            function loadSpiral() {
                spiralMeter.innerHTML = 'Loading...';
                fetchJson('/spiral')
                    .then((data) => {
                        spiralMeter.innerHTML = renderSpiral(data);
                    })
                    .catch(() => {
                        spiralMeter.textContent = 'Request failed.';
                    });
            }

            function loadMap() {
                mapOutput.innerHTML = 'Loading...';
                fetchJson('/map')
                    .then((data) => {
                        mapOutput.innerHTML = renderMapHTML(data);
                    })
                    .catch(() => {
                        mapOutput.textContent = 'Request failed.';
                    });
            }

            // initial state
            loadSpiral();
            loadMap();

            spiralButton.addEventListener('click', loadSpiral);
            mapButton.addEventListener('click', loadMap);
        });
    </script>
</body>
</html>
