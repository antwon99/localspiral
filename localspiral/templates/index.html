<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Spiral Simulator</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 1rem;
        }
        #container {
            max-width: 800px;
            margin: auto;
            border: 1px solid #0f0;
            padding: 1rem;
        }
        textarea {
            width: 100%;
            background-color: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 0.5rem;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 0.5rem 1rem;
            margin-top: 0.5rem;
            cursor: pointer;
        }
        .box {
            margin-top: 1rem;
            padding: 0.5rem;
            background: #001100;
            border: 1px solid #0f0;
            min-height: 80px;
            white-space: pre-wrap;
        }
        .map-grid {
            border-collapse: collapse;
            margin-top: 0.5rem;
        }
        .map-grid td {
            width: 1.2rem;
            height: 1.2rem;
            text-align: center;
        }
        .map-grid .wall {
            background: #0f0;
            color: #000;
        }
        .map-grid .player {
            color: #0f0;
            font-weight: bold;
        }
        .map-grid .enemy {
            color: #f00;
            font-weight: bold;
        }
        .map-grid .door {
            color: #ff0;
            font-weight: bold;
        }
        .map-grid .desk {
            color: #0ff;
            font-weight: bold;
        }
        @keyframes jitter {
            0% { transform: translate(0, 0); }
            50% { transform: translate(1px, -1px); }
            100% { transform: translate(0, 0); }
        }
        .unstable {
            animation: jitter 0.2s infinite;
        }
        @keyframes breakdown-shake {
            0% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(-4px, 4px) rotate(-1deg); }
            50% { transform: translate(4px, -4px) rotate(1deg); }
            75% { transform: translate(-4px, 4px) rotate(-1deg); }
            100% { transform: translate(0,0) rotate(0deg); }
        }
        .breakdown {
            animation: breakdown-shake 0.1s infinite;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>AI Spiral Simulator</h1>
        <textarea id="prompt" placeholder="Enter your prompt..."></textarea>
        <button id="sendButton">Send</button>
        <div id="skip-control"><button id="skipButton">Skip to Move</button></div>
        <div id="move-buttons" style="display:none;"></div>
        <div id="response" class="box"></div>
        <div id="spiral-meter" class="box"></div>
        <div id="extra-buttons">
            <button id="spiralButton">Test /spiral</button>
            <button id="mapButton">Test /map</button>
            <button id="resetButton">Reset</button>
        </div>
        <div id="map-output" class="box"></div>
        <label><input type="checkbox" id="debugToggle"> Debug Mode</label>
        <pre id="debug-info" class="box" style="display:none;"></pre>

    </div>
    <script>
        function fetchJson(url) {
            return fetch(url).then((res) =>
                res.json().then((data) => {
                    if (!res.ok) {
                        const err = new Error('Request failed');
                        err.data = data;
                        throw err;
                    }
                    return data;
                })
            );
        }

        function renderMapHTML(data) {
            if (!data || !Array.isArray(data.grid)) return '';
            let html = '<table class="map-grid">';
            for (const row of data.grid) {
                html += '<tr>';
                for (const cell of row) {
                    let cls = 'empty';
                    let text = '&nbsp;';
                    if (cell === '#') {
                        cls = 'wall';
                        text = '&#9608;';
                    } else if (cell === '@') {
                        cls = 'player';
                        text = '@';
                    } else if (cell === 'X') {
                        cls = 'enemy';
                        text = 'X';
                    } else if (cell === 'D') {
                        cls = 'door';
                        text = 'D';
                    } else if (cell === 'K') {
                        cls = 'desk';
                        text = '@';
                    }
                    html += `<td class="${cls}">${text}</td>`;
                }
                html += '</tr>';
            }
            html += '</table>';
            if ('seed' in data) html += `<p>Seed: ${data.seed}</p>`;
            if (data.analysis && data.analysis.description) {
                html += `<p>${data.analysis.description}</p>`;
            }
            if (Array.isArray(data.location)) {
                const name = data.display_name || 'Player';
                html += `<p>${name} at (${data.location[0]}, ${data.location[1]})</p>`;
            }
            return html;
        }

        function renderSpiral(data) {
            if ('score' in data || 'spiral_score' in data || 'sanity' in data) {
                const score = 'score' in data ? data.score : data.spiral_score;
                let html = '';
                if (score !== undefined) html += `<p><strong>Spiral Score:</strong> ${score}</p>`;
                if ('sanity' in data) html += `<p><strong>Sanity Level:</strong> ${data.sanity}</p>`;
                if ('status' in data) html += `<p><strong>Status:</strong> ${data.status}</p>`;
                if ('turn' in data) html += `<p><strong>Turn:</strong> ${data.turn}</p>`;
                if ('chat_count' in data && !data.awaiting_move)
                    html += `<p><strong>Prompt Count:</strong> ${data.chat_count}/5</p>`;
                return html;
            }
            if ('message' in data) {
                return `<p>${data.message}</p>`;
            }
            return `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        }

        function renderDebug(data) {
            const debugDiv = document.getElementById('debug-info');
            const toggle = document.getElementById('debugToggle');
            if (!toggle.checked || !data) {
                debugDiv.style.display = 'none';
                debugDiv.textContent = '';
                return;
            }
            debugDiv.style.display = 'block';
            let text = '';
            if (Array.isArray(data.perceived_grid)) {
                text += 'Perceived Grid:\n';
                text += data.perceived_grid.map(r => r.join('')).join('\n') + '\n';
            }
            if (Array.isArray(data.real_grid)) {
                text += 'Real Grid:\n';
                text += data.real_grid.map(r => r.join('')).join('\n') + '\n';
            }
            if (Array.isArray(data.enemies)) {
                text += 'Enemies: ' + data.enemies.map(p => `(${p[0]},${p[1]})`).join(' ') + '\n';
            }
            debugDiv.textContent = text;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const promptInput = document.getElementById('prompt');
            const sendButton = document.getElementById('sendButton');
            const skipButton = document.getElementById('skipButton');
            const moveButtons = document.getElementById('move-buttons');
            const responseDiv = document.getElementById('response');
            const spiralMeter = document.getElementById('spiral-meter');
            const spiralButton = document.getElementById('spiralButton');
            const mapButton = document.getElementById('mapButton');
            const resetButton = document.getElementById('resetButton');
            const mapOutput = document.getElementById('map-output');
            const debugToggle = document.getElementById('debugToggle');
            let lastDebugData = null;

            debugToggle.addEventListener('change', () => {
                renderDebug(lastDebugData);
            });

            function updateSpiralMeter(data) {
                spiralMeter.innerHTML = renderSpiral(data);

                const score = 'score' in data ? data.score : data.spiral_score;

                if (data.sanity <= 0) {
                    spiralMeter.innerHTML = `<h2>Final Spiral Score: ${score}</h2>` +
                        spiralMeter.innerHTML +
                        '<p><em>Refresh the page to start over.</em></p>';
                    spiralMeter.classList.add('breakdown');
                    promptInput.disabled = true;
                    sendButton.disabled = true;
                    return;
                }

                spiralMeter.classList.remove('breakdown');

                if (score >= 4) {
                    spiralMeter.classList.add('unstable');
                    responseDiv.classList.add('unstable');
                } else {
                    spiralMeter.classList.remove('unstable');
                    responseDiv.classList.remove('unstable');
                }

                if (data.awaiting_move) {
                    promptInput.disabled = true;
                    sendButton.disabled = true;
                    skipButton.style.display = 'none';
                    moveButtons.style.display = 'block';
                    moveButtons.innerHTML = 'Move:' +
                        data.directions.map(dir =>
                            ` <button class="move-btn" data-dir="${dir}">${dir.charAt(0).toUpperCase()}</button>`
                        ).join('');
            moveButtons.querySelectorAll('button[data-dir]').forEach(btn => {
                btn.addEventListener('click', () => {
                            const d = btn.getAttribute('data-dir');
                            responseDiv.textContent = 'Loading...';
                            fetchJson(`/chat?prompt=${d}`)
                                .then((res) => {
                                    responseDiv.textContent = res.message || res.error || 'No response';
                                    if (res.state) {
                                        updateSpiralMeter(res.state);
                                        if (res.grid && res.grid.grid) {
                                            mapOutput.innerHTML = renderMapHTML(res.grid);
                                        } else {
                                            loadMap(currentMapSeed);
                                        }
                                        lastDebugData = res.debug || null;
                                        renderDebug(lastDebugData);
                                    }
                                })
                                .catch(() => { responseDiv.textContent = 'Request failed.'; });
                });
            });
            } else {
                    promptInput.disabled = false;
                    sendButton.disabled = false;
                    moveButtons.style.display = 'none';
                    skipButton.style.display = 'inline-block';
                }
            }

            skipButton.addEventListener('click', () => {
                fetchJson('/skip')
                    .then((data) => {
                        if (data.state) {
                            updateSpiralMeter(data.state);
                        }
                    })
                    .catch(() => { responseDiv.textContent = 'Request failed.'; });
            });


            sendButton.addEventListener('click', () => {
                const prompt = promptInput.value.trim();
                if (!prompt) return;
                responseDiv.textContent = 'Loading...';
                fetchJson(`/chat?prompt=${encodeURIComponent(prompt)}`)
                    .then((data) => {
                        responseDiv.textContent = data.message || data.error || 'No response';
                        if (data.state) {
                            updateSpiralMeter(data.state);
                            if (typeof data.state.map_seed === 'number') {
                                currentMapSeed = data.state.map_seed;
                            }
                            lastDebugData = data.debug || null;
                            renderDebug(lastDebugData);
                        }
                        if (data.grid && data.grid.grid) {
                            mapOutput.innerHTML = renderMapHTML(data.grid);
                        } else {
                            loadMap(currentMapSeed);
                        }
                    })
                    .catch(() => {
                        responseDiv.textContent = 'Request failed.';
                    });
            });

            function loadSpiral() {
                spiralMeter.innerHTML = 'Loading...';
                fetchJson('/spiral')
                    .then((data) => {
                        updateSpiralMeter(data);
                    })
                    .catch(() => {
                        updateSpiralMeter({score: 0, sanity: 100, status: 'lucid'});
                    });
            }

            let currentMapSeed = null;

            function loadMap(seed) {
                mapOutput.innerHTML = 'Loading...';
                const url = typeof seed === 'number' ? `/map?seed=${seed}` : '/map';
                fetchJson(url)
                    .then((data) => {
                        mapOutput.innerHTML = renderMapHTML(data);
                        if (typeof data.seed === 'number') currentMapSeed = data.seed;
                    })
                    .catch(() => {
                        mapOutput.textContent = 'Request failed.';
                    });
            }


            // initial state
            loadSpiral();

            spiralButton.addEventListener('click', loadSpiral);
            mapButton.addEventListener('click', loadMap);
            resetButton.addEventListener('click', () => {
                fetchJson('/reset').then(() => {
                    promptInput.disabled = false;
                    sendButton.disabled = false;
                    responseDiv.textContent = '';
                    mapOutput.textContent = '';
                    loadSpiral();
                });
            });

        });
    </script>
</body>
</html>
