[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localspiral"
version = "0.1.0"
description = "AI Spiral Simulator - keep your AI protagonist coherent"
authors = [{name = "AI Spiral"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.0",
    "python-dotenv==1.0.0"
]

[project.scripts]
localspiral = "localspiral.main:main"

[tool.setuptools.packages.find]
where = ["localspiral"]

[tool.setuptools.package-data]
"localspiral" = [
    "templates/*.html",
    "characters/*.json"
]
    "characters/*.json",
    "static/*"
]
